[project]
name = "account-lifecycle-automation-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27.0",
  "playwright>=1.49.0",
  "pyyaml>=6.0.2"
]

[project.optional-dependencies]
dev = ["ruff>=0.5.0"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
ignore = ["BLE001", "PLR1730", "S110"]
